# Deploys every client guide (<client>/index.html) to GitHub Pages.
# The guides are written without <html>/<head>/<body> so the same file can
# also be published as a claude.ai artifact; this step adds the skeleton.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          mkdir _site
          for dir in */; do
            dir=${dir%/}
            [ -f "$dir/index.html" ] || continue
            cp -R "$dir" _site/
            {
              printf '%s' '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>'
              cat "$dir/index.html"
              printf '%s\n' '</body></html>'
            } > "_site/$dir/index.html"
          done
          [ -f index.html ] && cp index.html _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
